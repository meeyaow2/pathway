name: Test and deploy to GitHub Pages

# Pull requests: tests only (never published).
# Pushes to main: test -> build (upload public/) -> deploy, as separate jobs like GitHub's Pages template.
# Uploading and deploying in separate jobs avoids the "No artifacts named github-pages were found" race
# seen when deploy-pages queried the artifact a fraction of a second after uploading it in the same job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; superseded PR runs are cancelled, production runs are never cancelled mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit tests (no network)
        run: node --test tests/*.test.js
      - name: Syntax check
        run: for f in public/*.js; do node --check "$f"; done
      - name: The published folder contains the app (not the README)
        run: |
          test -f public/index.html && test -f public/app.js && test -f public/sw.js
          grep -q 'id="start-search"' public/index.html

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the service-worker build ID (new deploy = fresh app cache)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" public/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
